    const PRODUCTS = [
      { id:1, name:'Смартфон Ravo Pro Max 256GB', price:89990, oldPrice:99990, image:'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400&h=400&fit=crop', rating:4.9, reviews:1247, category:'Электроника', brand:'Ravo', badge:'Хит' },

      { id:9, name:'Платье вечернее золотое', price:12990, image:'https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=400&h=400&fit=crop', rating:4.9, reviews:289, category:'Одежда', brand:'Ravo Style', badge:'Эксклюзив' },
      { id:10, name:'Колонка портативная Ravo Boom', price:4990, oldPrice:6990, image:'https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=400&h=400&fit=crop', rating:4.6, reviews:1567, category:'Электроника', brand:'Ravo' },
      { id:11, name:'Солнцезащитные очки Gold Frame', price:3990, image:'https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=400&h=400&fit=crop', rating:4.4, reviews:812, category:'Аксессуары', brand:'Gold Frame' },
      { id:12, name:'Чехол для iPhone Premium Gold', price:2490, oldPrice:3490, image:'https://images.unsplash.com/photo-1601784551446-20c9e07cdbdb?w=400&h=400&fit=crop', rating:4.5, reviews:2341, category:'Аксессуары', brand:'Ravo', badge:'-29%' },
    ];

    const CATS = [
      { id:'all', name:'Все', icon:'✨' },
      { id:'Электроника', name:'Электроника', icon:'📱' },
      { id:'Одежда', name:'Одежда', icon:'👕' },
      { id:'Обувь', name:'Обувь', icon:'👟' },
      { id:'Аксессуары', name:'Аксессуары', icon:'👜' },
      { id:'Красота', name:'Красота', icon:'💄' },
    ];

    function useLocal(key, init) {
      const [v, setV] = useState(() => {
        try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : init; } catch { return init; }
      });
      useEffect(() => { localStorage.setItem(key, JSON.stringify(v)); }, [key, v]);
      return [v, setV];
    }

    // ===== BOTTOM NAV =====
    function BottomNav({ page, setPage, cartCount, favCount }) {
      const items = [
        { id: 'home', label: 'Главная', icon: '🏠' },
        { id: 'catalog', label: 'Каталог', icon: '▦' },
        { id: 'cart', label: 'Корзина', icon: '🛒', badge: cartCount },
        { id: 'favorites', label: 'Избранное', icon: '♡', badge: favCount },
        { id: 'profile', label: 'Профиль', icon: '👤' },
      ];
      return (
        <nav className="bottom-nav">
          <div className="flex items-stretch max-w-lg mx-auto">
            {items.map(item => (
              <button
                key={item.id}
                onClick={() => setPage(item.id)}
                className={`nav-item ${page === item.id || (page === 'product' && item.id === 'home') ? 'active' : ''}`}
              >
                <span className="icon">{item.icon}</span>
                <span>{item.label}</span>
                {item.badge > 0 && <span className="nav-badge">{item.badge > 99 ? '99+' : item.badge}</span>}
              </button>
            ))}
          </div>
        </nav>
      );
    }

    // ===== TOP HEADER (search only) =====
    function TopBar({ query, setQuery, theme, toggleTheme, showBack, onBack, title }) {
      if (showBack) {
        return (
          <div className="sticky top-0 z-50 flex items-center gap-3 px-3 py-3 border-b border-th" style={{background: 'var(--nav)', backdropFilter: 'blur(20px)'}}>
            <button onClick={onBack} className="p-2 -ml-1 text-lg">←</button>
            <h1 className="font-bold text-base flex-1 truncate">{title}</h1>
            <button onClick={toggleTheme} className="p-2 text-lg">{theme === 'dark' ? '☀️' : '🌙'}</button>
          </div>
        );
      }
      return (
        <div className="sticky top-0 z-50 px-3 py-2.5 border-b border-th" style={{background: 'var(--nav)', backdropFilter: 'blur(20px)'}}>
          <div className="flex items-center gap-2">
            <div className="w-8 h-8 rounded-lg gold-grad flex items-center justify-center shrink-0">
              <span className="text-black font-black text-sm">R</span>
            </div>
            <div className="flex-1 relative">
              <input
                value={query}
                onChange={e => setQuery(e.target.value)}
                placeholder="Найти на Ravo"
                className="w-full pl-3 pr-9 py-2 rounded-xl text-sm border border-th outline-none focus:border-gold"
                style={{background: 'var(--bg2)', color: 'var(--text)'}}
              />
              <span className="absolute right-2.5 top-1/2 -translate-y-1/2 text-sm opacity-50">🔍</span>
            </div>
            <button onClick={toggleTheme} className="p-2 text-lg shrink-0">{theme === 'dark' ? '☀️' : '🌙'}</button>
          </div>
        </div>
      );
    }

    function ProductCard({ p, index, onAdd, onFav, isFav, onOpen }) {
      return (
        <div className="group relative bg-card rounded-2xl border border-th overflow-hidden card-h fade-in" style={{animationDelay: `${Math.min(index, 8)*0.04}s`}}>
          <div className="relative aspect-square overflow-hidden bg-sec" onClick={() => onOpen(p)}>
            <img src={p.image} alt={p.name} className="w-full h-full object-cover" loading="lazy" />
            {p.badge && <span className="absolute top-2 left-2 px-1.5 py-0.5 rounded-md text-[10px] font-bold bg-gold text-black">{p.badge}</span>}
            <button onClick={e => { e.stopPropagation(); onFav(p.id); }} className="absolute top-2 right-2 w-8 h-8 rounded-full bg-black/40 backdrop-blur-sm flex items-center justify-center text-sm">
              {isFav ? '❤️' : '🤍'}
            </button>
          </div>
          <div className="p-2.5" onClick={() => onOpen(p)}>
            <div className="flex items-center gap-1 mb-1 text-[11px]">
              <span className="text-gold">★</span>
              <span className="font-semibold">{p.rating}</span>
              <span className="text-muted">({p.reviews})</span>
            </div>
            <h3 className="text-[13px] font-medium leading-snug line-clamp-2 mb-1">{p.name}</h3>
            <div className="flex items-end justify-between gap-1 mt-1.5">
              <div>
                <div className="text-[15px] font-bold leading-none">{p.price.toLocaleString('ru-RU')} ₽</div>
                {p.oldPrice && <div className="text-[10px] text-muted line-through mt-0.5">{p.oldPrice.toLocaleString('ru-RU')} ₽</div>}
              </div>
              <button onClick={e => { e.stopPropagation(); onAdd(p); }} className="w-8 h-8 rounded-lg btn-gold flex items-center justify-center text-sm shrink-0">+</button>
            </div>
          </div>
        </div>
      );
    }

    function Home({ products, onAdd, onFav, favs, onOpen, cat, setCat, query }) {
      const filtered = useMemo(() => {
        let list = products;
        if (query) {
          const q = query.toLowerCase();
          list = list.filter(p => p.name.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q) || p.category.toLowerCase().includes(q));
        }
        if (cat !== 'all') list = list.filter(p => p.category === cat);
        return list;
      }, [products, query, cat]);

      return (
        <div className="px-3 pt-3">
          <div className="rounded-2xl overflow-hidden mb-4 gold-grad p-5 fade-in">
            <h1 className="text-xl font-black text-black mb-1 tracking-tight">Ravo</h1>
            <p className="text-black/75 text-xs mb-3">Золотой стандарт доставки</p>
            <button className="px-4 py-2 rounded-xl bg-black text-gold font-semibold text-xs">Смотреть всё</button>
          </div>
          <div className="flex gap-2 overflow-x-auto pb-3 mb-3 -mx-1 px-1" style={{scrollbarWidth:'none'}}>
            {CATS.map(c => (
              <button key={c.id} onClick={() => setCat(c.id)}
                className={`shrink-0 flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium transition-all ${cat===c.id ? 'bg-gold text-black' : 'bg-card border border-th'}`}>
                <span>{c.icon}</span>{c.name}
              </button>
            ))}
          </div>
          {query && <p className="text-xs text-muted mb-3">Найдено: {filtered.length}</p>}
          {filtered.length === 0 ? (
            <div className="text-center py-16"><p className="font-medium mb-1">Ничего не найдено</p><p className="text-muted text-sm">Попробуйте другой запрос</p></div>
          ) : (
            <div className="grid grid-cols-2 gap-2.5">
              {filtered.map((p,i) => (
                <ProductCard key={p.id} p={p} index={i} onAdd={onAdd} onFav={onFav} isFav={favs.includes(p.id)} onOpen={onOpen} />
              ))}
            </div>
          )}
        </div>
      );
    }

    function Catalog({ products, onAdd, onFav, favs, onOpen, cat, setCat }) {
      const filtered = cat === 'all' ? products : products.filter(p => p.category === cat);
      return (
        <div className="px-3 pt-3">
          <h1 className="text-lg font-bold mb-3">Каталог</h1>
          <div className="grid grid-cols-3 gap-2 mb-4">
            {CATS.filter(c => c.id !== 'all').map(c => (
              <button key={c.id} onClick={() => setCat(c.id)}
                className={`flex flex-col items-center gap-1 p-3 rounded-2xl border transition-all ${cat===c.id ? 'border-gold bg-gold/10' : 'border-th bg-card'}`}>
                <span className="text-2xl">{c.icon}</span>
                <span className="text-[11px] font-medium">{c.name}</span>
              </button>
            ))}
          </div>
          <div className="flex items-center justify-between mb-3">
            <span className="text-sm text-muted">{filtered.length} товаров</span>
            {cat !== 'all' && <button onClick={() => setCat('all')} className="text-xs text-gold font-medium">Сбросить</button>}
          </div>
          <div className="grid grid-cols-2 gap-2.5">
            {filtered.map((p,i) => (
              <ProductCard key={p.id} p={p} index={i} onAdd={onAdd} onFav={onFav} isFav={favs.includes(p.id)} onOpen={onOpen} />
            ))}
          </div>
        </div>
      );
    }

    function Cart({ cart, updateQty, remove, total, clear, setPage }) {
      if (!cart.length) return (
        <div className="px-4 py-20 text-center fade-in">
          <div className="text-5xl mb-3">🛒</div>
          <h2 className="text-lg font-bold mb-1">Корзина пуста</h2>
          <p className="text-muted text-sm mb-5">Добавьте товары из каталога</p>
          <button onClick={() => setPage('home')} className="px-6 py-2.5 rounded-xl btn-gold text-sm">На главную</button>
        </div>
      );
      return (
        <div className="px-3 pt-3 fade-in">
          <div className="flex items-center justify-between mb-4">
            <h1 className="text-lg font-bold">Корзина · {cart.length}</h1>
            <button onClick={clear} className="text-xs text-muted">Очистить</button>
          </div>
          <div className="space-y-2.5 mb-4">
            {cart.map(({product:p, qty}) => (
              <div key={p.id} className="flex gap-3 p-3 rounded-2xl bg-card border border-th">
                <img src={p.image} className="w-20 h-20 rounded-xl object-cover bg-sec shrink-0" />
                <div className="flex-1 min-w-0">
                  <p className="text-[13px] font-medium line-clamp-2 leading-snug">{p.name}</p>
                  <p className="text-[11px] text-muted mt-0.5">{p.brand}</p>
                  <div className="flex items-center justify-between mt-2">
                    <div className="flex items-center gap-0.5 bg-sec rounded-lg">
                      <button onClick={() => updateQty(p.id, qty-1)} className="w-7 h-7 flex items-center justify-center text-sm">−</button>
                      <span className="w-6 text-center text-sm font-semibold">{qty}</span>
                      <button onClick={() => updateQty(p.id, qty+1)} className="w-7 h-7 flex items-center justify-center text-sm">+</button>
                    </div>
                    <div className="flex items-center gap-2">
                      <span className="text-sm font-bold">{(p.price*qty).toLocaleString('ru-RU')} ₽</span>
                      <button onClick={() => remove(p.id)} className="text-muted text-sm">✕</button>
                    </div>
                  </div>
                </div>
              </div>
            ))}
          </div>
          <div className="p-4 rounded-2xl bg-card border border-th space-y-3">
            <div className="flex justify-between text-sm"><span className="text-muted">Товары</span><span>{total.toLocaleString('ru-RU')} ₽</span></div>
            <div className="flex justify-between text-sm"><span className="text-muted">Доставка</span><span className="text-green-500">Бесплатно</span></div>
            <div className="border-t border-th pt-3 flex justify-between items-baseline">
              <span className="font-bold">Итого</span>
              <span className="text-xl font-black gold-text">{total.toLocaleString('ru-RU')} ₽</span>
            </div>
            <button className="w-full py-3 rounded-xl btn-gold text-sm font-semibold">Оформить заказ</button>
          </div>
        </div>
      );
    }

    function Favorites({ favs, products, onAdd, onFav, onOpen, setPage }) {
      const list = products.filter(p => favs.includes(p.id));
      if (!list.length) return (
        <div className="px-4 py-20 text-center fade-in">
          <div className="text-5xl mb-3">♡</div>
          <h2 className="text-lg font-bold mb-1">В избранном пусто</h2>
          <p className="text-muted text-sm mb-5">Нажимайте сердечко на товарах</p>
          <button onClick={() => setPage('home')} className="px-6 py-2.5 rounded-xl btn-gold text-sm">На главную</button>
        </div>
      );
      return (
        <div className="px-3 pt-3 fade-in">
          <h1 className="text-lg font-bold mb-4">Избранное · {list.length}</h1>
          <div className="grid grid-cols-2 gap-2.5">
            {list.map((p,i) => <ProductCard key={p.id} p={p} index={i} onAdd={onAdd} onFav={onFav} isFav={true} onOpen={onOpen} />)}
          </div>
        </div>
      );
    }

    function Profile({ theme, toggleTheme, loggedIn, setLoggedIn }) {
      const [phone, setPhone] = useState('');
      if (!loggedIn) return (
        <div className="px-4 py-12 fade-in">
          <div className="text-center mb-8">
            <div className="w-16 h-16 rounded-2xl gold-grad mx-auto flex items-center justify-center mb-4 shadow-lg">
              <span className="text-black font-black text-2xl">R</span>
            </div>
            <h1 className="text-xl font-bold mb-1">Вход в Ravo</h1>
            <p className="text-muted text-sm">Войдите, чтобы видеть заказы</p>
          </div>
          <div className="space-y-3 max-w-sm mx-auto">
            <input value={phone} onChange={e => setPhone(e.target.value)} placeholder="+7 (999) 000-00-00"
              className="w-full px-4 py-3 rounded-xl border border-th text-sm outline-none focus:border-gold"
              style={{background:'var(--bg2)', color:'var(--text)'}} />
            <button onClick={() => setLoggedIn(true)} className="w-full py-3 rounded-xl btn-gold text-sm font-semibold">Получить код</button>
          </div>
        </div>
      );
      return (
        <div className="px-3 pt-3 fade-in">
          <div className="flex items-center gap-3 p-4 rounded-2xl bg-card border border-th mb-4">
            <div className="w-12 h-12 rounded-full gold-grad flex items-center justify-center text-xl">👤</div>
            <div>
              <h2 className="font-bold">Пользователь Ravo</h2>
              <p className="text-xs text-muted">+7 (999) •••-••-42</p>
            </div>
          </div>
          {['Мои заказы','Адреса доставки','Способы оплаты','Настройки'].map(l => (
            <div key={l} className="flex items-center gap-3 px-4 py-3.5 rounded-xl active:bg-sec">
              <span className="text-gold text-sm">›</span>
              <span className="flex-1 text-sm font-medium">{l}</span>
            </div>
          ))}
          <button onClick={toggleTheme} className="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-sm font-medium">
            {theme==='dark' ? '☀️  Светлая тема' : '🌙  Тёмная тема'}
          </button>
          <button onClick={() => setLoggedIn(false)} className="w-full mt-3 py-3 rounded-xl text-red-500 text-sm font-medium">Выйти</button>
        </div>
      );
    }

    function ProductPage({ product, onAdd, onFav, isFav }) {
      if (!product) return <div className="text-center py-20">Товар не найден</div>;
      return (
        <div className="fade-in">
          <div className="aspect-square bg-sec relative">
            <img src={product.image} alt={product.name} className="w-full h-full object-cover" />
            {product.badge && <span className="absolute top-3 left-3 px-2 py-0.5 rounded-lg text-xs font-bold bg-gold text-black">{product.badge}</span>}
          </div>
          <div className="px-4 pt-4 pb-6">
            <div className="flex items-center gap-2 mb-2 text-sm">
              <span className="text-gold">★ {product.rating}</span>
              <span className="text-muted">{product.reviews.toLocaleString('ru-RU')} отзывов</span>
            </div>
            <h1 className="text-lg font-bold mb-1 leading-snug">{product.name}</h1>
            <p className="text-sm text-muted mb-4">{product.brand} · {product.category}</p>
            <div className="flex items-baseline gap-2 mb-5">
              <span className="text-2xl font-black">{product.price.toLocaleString('ru-RU')} ₽</span>
              {product.oldPrice && <span className="text-base text-muted line-through">{product.oldPrice.toLocaleString('ru-RU')} ₽</span>}
            </div>
            <div className="flex gap-2 mb-5">
              <button onClick={() => onAdd(product)} className="flex-1 py-3 rounded-xl btn-gold text-sm font-semibold">В корзину</button>
              <button onClick={() => onFav(product.id)} className={`w-12 h-12 rounded-xl border flex items-center justify-center text-lg ${isFav ? 'border-gold bg-gold/10' : 'border-th'}`}>
                {isFav ? '❤️' : '🤍'}
              </button>
            </div>
            <div className="space-y-2.5 p-3.5 rounded-2xl bg-sec text-sm">
              <div>🚚 Бесплатная доставка от 2000 ₽</div>
              <div>🛡 Гарантия подлинности</div>
              <div>↩ Возврат 14 дней</div>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [theme, setTheme] = useLocal('ravo-theme', 'dark');
      const [page, setPage] = useState('home');
      const [prevPage, setPrevPage] = useState('home');
      const [query, setQuery] = useState('');
      const [cat, setCat] = useState('all');
      const [cart, setCart] = useLocal('ravo-cart', []);
      const [favs, setFavs] = useLocal('ravo-favs', []);
      const [loggedIn, setLoggedIn] = useState(false);
      const [selected, setSelected] = useState(null);

      useEffect(() => {
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#0A0A0A' : '#FFFFFF');
      }, [theme]);

      const toggleTheme = () => setTheme(t => t === 'dark' ? 'light' : 'dark');

      const goTo = (p) => {
        if (p !== 'product') setPrevPage(page === 'product' ? prevPage : page);
        setPage(p);
        window.scrollTo(0, 0);
      };

      const addToCart = (p) => {
        setCart(prev => {
          const ex = prev.find(i => i.product.id === p.id);
          if (ex) return prev.map(i => i.product.id === p.id ? {...i, qty: i.qty+1} : i);
          return [...prev, {product: p, qty: 1}];
        });
      };
      const removeFromCart = (id) => setCart(prev => prev.filter(i => i.product.id !== id));
      const updateQty = (id, qty) => {
        if (qty < 1) return removeFromCart(id);
        setCart(prev => prev.map(i => i.product.id === id ? {...i, qty} : i));
      };
      const toggleFav = (id) => setFavs(prev => prev.includes(id) ? prev.filter(f => f !== id) : [...prev, id]);
      const cartCount = cart.reduce((s,i) => s + i.qty, 0);
      const cartTotal = cart.reduce((s,i) => s + i.product.price * i.qty, 0);

      const openProduct = (p) => {
        setSelected(p);
        setPrevPage(page);
        setPage('product');
        window.scrollTo(0, 0);
      };

      const isProduct = page === 'product';

      return (
        <div className="min-h-screen flex flex-col bg-main text-main">
          <TopBar
            query={query}
            setQuery={setQuery}
            theme={theme}
            toggleTheme={toggleTheme}
            showBack={isProduct}
            onBack={() => goTo(prevPage || 'home')}
            title={selected?.name || 'Товар'}
          />

          <main className="page-content flex-1">
            {page === 'home' && <Home products={PRODUCTS} onAdd={addToCart} onFav={toggleFav} favs={favs} onOpen={openProduct} cat={cat} setCat={setCat} query={query} />}
            {page === 'catalog' && <Catalog products={PRODUCTS} onAdd={addToCart} onFav={toggleFav} favs={favs} onOpen={openProduct} cat={cat} setCat={setCat} />}
            {page === 'cart' && <Cart cart={cart} updateQty={updateQty} remove={removeFromCart} total={cartTotal} clear={() => setCart([])} setPage={goTo} />}
            {page === 'favorites' && <Favorites favs={favs} products={PRODUCTS} onAdd={addToCart} onFav={toggleFav} onOpen={openProduct} setPage={goTo} />}
            {page === 'profile' && <Profile theme={theme} toggleTheme={toggleTheme} loggedIn={loggedIn} setLoggedIn={setLoggedIn} />}
            {page === 'product' && <ProductPage product={selected} onAdd={addToCart} onFav={toggleFav} isFav={selected && favs.includes(selected.id)} />}
          </main>

          {!isProduct && (
            <BottomNav page={page} setPage={goTo} cartCount={cartCount} favCount={favs.length} />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
